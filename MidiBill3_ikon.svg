<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <rect x="4" y="4" width="248" height="248" rx="52" fill="#ffffff" stroke="#e2e2e2" stroke-width="4"/>

  <!-- 4 fan-out lines from the highlighted key to 4 colored dots, evenly spaced on an arc -->
  <path d="M96 112 C96 80, 60 60, 44 56" fill="none" stroke="#4f7cff" stroke-width="5" stroke-linecap="round"/>
  <path d="M96 112 C96 80, 90 55, 100 43" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>
  <path d="M96 112 C96 80, 166 55, 156 43" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
  <path d="M96 112 C96 80, 196 60, 212 56" fill="none" stroke="#ec4899" stroke-width="5" stroke-linecap="round"/>

  <circle cx="44" cy="56" r="12" fill="#4f7cff"/>
  <circle cx="100" cy="43" r="12" fill="#10b981"/>
  <circle cx="156" cy="43" r="12" fill="#f59e0b"/>
  <circle cx="212" cy="56" r="12" fill="#ec4899"/>

  <!-- piano keys - roughly half the icon height -->
  <g>
    <rect x="36" y="112" width="184" height="128" rx="14" fill="#ffffff" stroke="#c9c9c9" stroke-width="5"/>
    <line x1="82" y1="112" x2="82" y2="240" stroke="#c9c9c9" stroke-width="5"/>
    <line x1="128" y1="112" x2="128" y2="240" stroke="#c9c9c9" stroke-width="5"/>
    <line x1="174" y1="112" x2="174" y2="240" stroke="#c9c9c9" stroke-width="5"/>

    <!-- highlighted key (2nd from left) -->
    <rect x="82" y="112" width="46" height="128" rx="14" fill="#eef2ff" stroke="#4f7cff" stroke-width="6"/>

    <!-- black keys -->
    <rect x="62" y="112" width="26" height="78" rx="4" fill="#2b2b2b"/>
    <rect x="150" y="112" width="26" height="78" rx="4" fill="#2b2b2b"/>
  </g>
</svg>
